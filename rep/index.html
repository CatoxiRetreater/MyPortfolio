<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goa '26 Planner</title>
<meta name="theme-color" content="#F5F3EE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EE;--bg2:#EEEBE4;--card:#FFFFFF;--card2:#F6F4EF;--line:#E5E1D8;--line2:#EFECE6;
  --text:#1D1C1A;--muted:#6E695F;--dim:#A6A196;
  --acc:#2F5D57;--acc-soft:#E3ECE9;--warn:#A8742F;--warn-soft:#F4EBDD;--red:#A6493B;--red-soft:#F5E4E0;--green:#3F7454;--green-soft:#E4EEE7;--blue:#3E6383;--blue-soft:#E3EAF1;
  --shadow:0 1px 2px rgba(29,28,26,.04),0 4px 16px -8px rgba(29,28,26,.08);
  --r:14px;--rs:10px;
  --display:'Instrument Serif',Georgia,'Times New Roman',serif;
  --body:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#131312;--bg2:#1A1A18;--card:#1C1C1A;--card2:#222220;--line:#2D2C29;--line2:#262523;
  --text:#ECE9E2;--muted:#9D988D;--dim:#6B675F;
  --acc:#8FBDB4;--acc-soft:#22302D;--warn:#D3A564;--warn-soft:#2E281F;--red:#D98C7E;--red-soft:#2F2220;--green:#8DBE9C;--green-soft:#212C24;--blue:#93B3CF;--blue-soft:#20272F;
  --shadow:none;color-scheme:dark;
}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:14.5px;line-height:1.55;min-height:100vh;font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc);flex:none;cursor:pointer}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
textarea{resize:vertical;min-height:70px}
label.f{display:block;font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:.02em;margin-bottom:6px}

/* shell */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.brand{font-family:var(--display);font-size:26px;letter-spacing:-.01em;white-space:nowrap;line-height:1}
.brand b{font-weight:400;font-style:italic;color:var(--acc)}
.nav{display:flex;gap:2px;margin-left:auto}
.nav button{padding:7px 12px;border-radius:8px;color:var(--muted);font-weight:500;font-size:13.5px;display:flex;align-items:center;gap:7px;transition:.15s}
.nav button:hover{color:var(--text);background:var(--bg2)}
.nav button.on{color:var(--text);background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.nav svg.i{width:16px;height:16px}
main{max-width:1080px;margin:0 auto;padding:32px 20px 110px}
@media(max-width:760px){
  .top{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  .nav{position:fixed;left:0;right:0;bottom:0;margin:0;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
  .nav button{flex-direction:column;gap:3px;font-size:10.5px;padding:6px 8px}
  .nav svg.i{width:20px;height:20px}
  .nav button.on{background:transparent;box-shadow:none;color:var(--acc)}
  main{padding:22px 16px 110px}
}

/* generic */
h1,h2{font-family:var(--display);font-weight:400;letter-spacing:-.01em;line-height:1.05}
h2{font-size:34px}
h3{font-size:15px;font-weight:600;letter-spacing:-.005em}
.sub{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
@media(max-width:420px){.g4{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card.flat{background:transparent;box-shadow:none;border-style:dashed}
.sec-h{display:flex;align-items:flex-end;gap:12px;margin:0 0 22px;flex-wrap:wrap}
.sec-h .sub{margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;font-weight:500;font-size:13.5px;background:var(--card);border:1px solid var(--line);transition:.15s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--dim)}
.btn.pri{background:var(--text);border-color:var(--text);color:var(--bg)}
.btn.pri:hover{opacity:.88}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--bg2)}
.btn.danger{color:var(--red)}
.icon-btn{width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center;color:var(--dim);flex:none;font-size:13px}
.icon-btn:hover{background:var(--bg2);color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:6px;font-size:12px;font-weight:500;background:var(--bg2);color:var(--muted);white-space:nowrap}
.cdot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.seg{display:inline-flex;background:var(--bg2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 13px;border-radius:7px;font-weight:500;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.meter{height:4px;border-radius:99px;background:var(--bg2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .4s}
.meter.warn i{background:var(--warn)}
.meter.bad i{background:var(--red)}
.empty{text-align:center;color:var(--muted);padding:40px 16px;border:1px dashed var(--line);border-radius:var(--r)}
.empty .e{display:none}
.num{font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.pos{color:var(--green)}.neg{color:var(--red)}
.mt{margin-top:14px}.mt2{margin-top:24px}.mb{margin-bottom:14px}

/* hero */
.hero{position:relative;border-radius:18px;padding:34px 32px 30px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.hero .waves{position:absolute;right:-20px;bottom:0;width:60%;height:90px;opacity:.9;pointer-events:none}
.hero .waves path{fill:none;stroke:var(--line);stroke-width:1.2}
.hero-kick{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
.hero h1{font-size:clamp(48px,9vw,76px);margin:8px 0 6px}
.hero h1 em{color:var(--acc)}
.hero .meta{color:var(--muted)}
.cd{display:flex;gap:28px;margin-top:26px;flex-wrap:wrap;position:relative}
.cd div{min-width:52px}
.cd b{display:block;font-family:var(--display);font-weight:400;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.cd span{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.stat .k{font-size:12px;color:var(--muted);font-weight:500}
.stat .v{font-size:26px;font-weight:600;margin:6px 0 10px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .s{font-size:12.5px;color:var(--muted)}
.crew{display:flex;flex-wrap:wrap;gap:8px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;color:#2A2823;flex:none}
.crew-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 3px;font-weight:500;font-size:13.5px}

/* plan */
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;scroll-snap-type:x mandatory}
.days::-webkit-scrollbar{display:none}
.day-pill{flex:none;scroll-snap-align:start;min-width:78px;text-align:left;padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);transition:.15s}
.day-pill:hover{border-color:var(--dim)}
.day-pill .dw{font-size:10.5px;font-weight:500;letter-spacing:.12em;color:var(--muted)}
.day-pill .dn{font-family:var(--display);font-size:26px;line-height:1.05}
.day-pill .dc{font-size:11px;color:var(--dim)}
.day-pill.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.day-pill.on .dw,.day-pill.on .dc{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.day-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin:18px 0 22px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.day-big{font-family:var(--display);font-size:72px;line-height:.85;color:var(--text)}
.day-title{font-family:var(--display);font-size:28px;background:transparent;border:1px solid transparent;padding:0 6px;margin-left:-7px;border-radius:6px;width:auto;min-width:220px;max-width:100%}
.day-title:hover{border-color:var(--line)}
textarea.day-title{resize:none;overflow:hidden;min-height:0;line-height:1.15;width:100%;display:block;field-sizing:content}
.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:5px;top:10px;bottom:10px;width:1px;background:var(--line)}
.ev{position:relative;margin-bottom:10px}
.ev .dot{position:absolute;left:-23px;top:22px;width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 4px var(--bg)}
.ev-card{display:grid;grid-template-columns:84px 1fr auto;gap:16px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;cursor:pointer;transition:border-color .15s,box-shadow .15s;box-shadow:var(--shadow)}
.ev-card:hover{border-color:var(--dim)}
.ev-time{font-weight:600;font-size:14px;color:var(--text);line-height:1.3;font-variant-numeric:tabular-nums}
.ev-time small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.ev-t{font-weight:600;font-size:15.5px;color:var(--text);line-height:1.35}
.ev-p{font-size:13px;color:var(--muted);margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ev-p a{color:var(--acc);text-decoration:none}
.ev-p a:hover{text-decoration:underline}
.ev-n{font-size:13px;color:var(--muted);margin-top:8px;white-space:pre-wrap;line-height:1.5}
.ev-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.st-booked{background:var(--green-soft);color:var(--green)}
.st-planned{background:var(--blue-soft);color:var(--blue)}
.st-idea{background:var(--warn-soft);color:var(--warn)}
@media(max-width:560px){.ev-card{grid-template-columns:1fr auto;gap:10px;padding:14px}.ev-time{grid-column:1/-1;display:flex;gap:6px;align-items:baseline}.ev-time small{display:inline}.ev-time small::before{content:"· "}.day-big{font-size:56px}.day-title{font-size:24px}}
.full{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.full .col{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.full .col-h{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.full .col-h .num{font-family:var(--display);font-weight:400;font-size:24px}
.full .it{display:flex;gap:10px;align-items:baseline;padding:9px 16px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:13.5px}
.full .it:hover{background:var(--card2)}
.full .it:last-child{border-bottom:0}
.full .it .tm{min-width:52px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}

/* tables */
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:8px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:middle;font-variant-numeric:tabular-nums}
.tbl input{padding:6px 9px;border-color:transparent;background:transparent}
.tbl input:hover{border-color:var(--line)}
.tbl input:focus{background:var(--card);border-color:var(--acc)}
.tbl .n{text-align:right}
.tbl input.n{max-width:110px;margin-left:auto;display:block}
.tbl tfoot td{font-weight:600;border-bottom:0;padding-top:14px}
.tbl .ic-col{display:none}
.scroll-x{overflow-x:auto;margin:0 -4px;padding:0 4px}
.mini-bar{height:4px;border-radius:9px;background:var(--bg2);overflow:hidden;min-width:70px}
.mini-bar i{display:block;height:100%;background:var(--acc)}
.mini-bar.over i{background:var(--red)}
@media(max-width:640px){
  .btbl thead,.btbl tfoot{display:none}
  .btbl tbody tr{display:grid;grid-template-columns:1fr 1fr 30px;gap:6px 8px;padding:12px 0;border-bottom:1px solid var(--line2)}
  .btbl td{border:0;padding:0}
  .btbl td:nth-child(2){grid-column:1/3;grid-row:1}
  .btbl td:nth-child(7){grid-column:3;grid-row:1}
  .btbl td:nth-child(3){grid-column:1;grid-row:2}
  .btbl td:nth-child(4){grid-column:2;grid-row:2}
  .btbl td:nth-child(5){grid-column:1;grid-row:3;text-align:left;font-size:12.5px}
  .btbl td:nth-child(6){grid-column:2/4;grid-row:3;align-self:center}
  .btbl td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted);margin:0 0 2px 9px}
  .btbl td:nth-child(2) input{font-weight:600}
  .btbl input.n{max-width:none;text-align:left;margin:0}
}

/* lists */
.check{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line2)}
.check:last-child{border-bottom:0}
.check.done span.t{color:var(--dim);text-decoration:line-through}
.check .t{flex:1}
.check select{width:auto;padding:5px 26px 5px 9px;font-size:13px}
.add-line{display:flex;gap:8px;margin-top:12px}
.add-line input{flex:1}
.bk{display:grid;gap:12px}
.bk-top{display:flex;gap:10px;align-items:center}
.bk-top input.name{font-weight:600;font-size:15px;background:transparent;border-color:transparent;padding:4px 6px;margin-left:-7px}
.bk-top input.name:hover{border-color:var(--line)}
.bk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.bk-grid label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:4px}

/* guide */
.idea{display:flex;flex-direction:column;gap:8px}
.idea h3{font-family:var(--display);font-weight:400;font-size:23px;letter-spacing:-.005em;line-height:1.15}
.idea p{color:var(--muted);font-size:13.5px;flex:1}
.idea .price{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rule{display:flex;gap:18px}
.rule .ic{font-family:var(--display);font-size:30px;line-height:1;color:var(--dim);flex:none;width:36px}
.rule h3{font-size:15.5px}
.rule p{color:var(--muted);font-size:13.5px;margin-top:4px}
.rule ul{color:var(--muted);font-size:13.5px;margin:8px 0 0 16px}
.rule li{margin-bottom:3px}
.contact{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.contact:last-child{border-bottom:0}
.contact .ci{display:none}
.call{border:1px solid var(--line);color:var(--acc);border-radius:8px;padding:6px 13px;font-weight:500;font-size:13px;text-decoration:none;white-space:nowrap}
.call:hover{border-color:var(--acc)}
@media(max-width:560px){.ct-f{grid-template-columns:1fr!important}}

/* modal */
.ov{position:fixed;inset:0;background:rgba(20,19,17,.4);backdrop-filter:blur(2px);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:540px;max-height:92vh;overflow:auto;padding:24px 22px calc(22px + env(safe-area-inset-bottom));animation:up .2s ease;box-shadow:0 20px 60px -20px rgba(0,0,0,.35)}
.modal h2{font-size:28px!important}
@media(min-width:640px){.ov{align-items:center;padding:20px}.modal{border-radius:18px}}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:8px;border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--muted);background:var(--card)}
.cats button.on{color:var(--text);border-color:var(--text);background:var(--card2)!important}
#x-split button.on{background:var(--text)!important;color:var(--bg);border-color:var(--text)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(12px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:9px;font-weight:500;font-size:13.5px;opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}

/* print */
@media print{
  :root{--bg:#fff;--card:#fff;--line:#ddd;--text:#111;--muted:#555}
  .top,.no-print,.ov,.toast{display:none!important}
  main{padding:0;max-width:none}
  .full{grid-template-columns:repeat(2,1fr)}
  .full .col,.card{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">Goa <b>'26</b></div>
    <nav class="nav" id="nav"></nav>
  </div>
</header>
<main id="app"></main>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===== helpers ===== */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => (n < 0 ? '-' : '') + '₹' + Math.round(Math.abs(n || 0)).toLocaleString('en-IN');
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const KEY = 'goa26-planner-v1';
const COLORS = ['#D9C7AE','#B9CFC8','#C3CDDD','#E0C3B8','#CBC2DA','#D2D6B5','#C9D9E3','#E3D3C0'];

const CATS = {
  travel:  {l:'Travel',   i:'🚆', c:'#7C8AA5'},
  stay:    {l:'Stay',     i:'🏡', c:'#5E8F87'},
  food:    {l:'Food',     i:'🍤', c:'#C49A55'},
  beach:   {l:'Beach',    i:'🏖️', c:'#5E95B8'},
  explore: {l:'Explore',  i:'🧭', c:'#7E9C6B'},
  activity:{l:'Activity', i:'🌊', c:'#C27A5E'},
  party:   {l:'Party',    i:'🪩', c:'#9C6F8E'},
  chill:   {l:'Chill',    i:'🌴', c:'#A8A296'}
};
const STATUS = {idea:'Idea', planned:'Planned', booked:'Booked'};
const mapUrl = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q + ', Goa');

/* ===== default data ===== */
function defaults() {
  const crew = ['Sangam','Boy 2','Boy 3','Boy 4','Boy 5','Boy 6'].map((n, i) => ({id: uid(), name: n, color: COLORS[i]}));
  const E = (date, time, title, cat, o = {}) => ({id: uid(), date, time, end: o.end || '', title, cat, place: o.place || '', cost: o.cost || 0, status: o.status || 'planned', notes: o.notes || ''});

/* ===== state ===== */
let S;
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const d = JSON.parse(raw); if (d && d.v === 1) return Object.assign(defaults(), d); } } catch (e) {}
  return defaults();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
S = load();

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800); }
function tripDates() { const out = []; let d = new Date(S.trip.start + 'T00:00'); const e = new Date(S.trip.end + 'T00:00'); let g = 0; while (d <= e && g++ < 40) { out.push(iso(d)); d.setDate(d.getDate() + 1); } return out; }
function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dParts(ds) { const d = new Date(ds + 'T00:00'); return {w: d.toLocaleDateString('en-IN', {weekday: 'short'}).toUpperCase(), n: d.getDate(), m: d.toLocaleDateString('en-IN', {month: 'short'}), long: d.toLocaleDateString('en-IN', {weekday: 'long', day: 'numeric', month: 'long'})}; }
function fmtTime(t) { if (!t) return 'Anytime'; const [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; return ((h % 12) || 12) + (m ? ':' + String(m).padStart(2, '0') : '') + ' ' + ap; }
function evSort(a, b) { return (a.date + (a.time || '99')).localeCompare(b.date + (b.time || '99')); }
const person = id => S.crew.find(p => p.id === id);
const pname = id => (person(id) || {name: '?'}).name;
const avatar = p => `<span class="av" style="background:${p.color}">${esc((p.name || '?').trim()[0] || '?').toUpperCase()}</span>`;

/* ===== computed ===== */
function budgetTotals() {
  const planned = S.budget.reduce((s, b) => s + num(b.planned), 0);
  const paid = S.budget.reduce((s, b) => s + num(b.paid), 0);
  return {planned, paid, cap: num(S.trip.cap), head: num(S.trip.cap) - planned};
}
function spentPP() { const n = S.crew.length || 1; const m = {}; let t = 0; S.expenses.forEach(e => { m[e.cat] = (m[e.cat] || 0) + num(e.amount) / n; t += num(e.amount) / n; }); return {m, t}; }
function balances() {
  const b = {}; S.crew.forEach(p => b[p.id] = 0);
  S.expenses.forEach(e => { const sp = (e.split || []).filter(id => id in b); if (!sp.length) return; if (e.payer in b) b[e.payer] += num(e.amount); const sh = num(e.amount) / sp.length; sp.forEach(id => b[id] -= sh); });
  return b;
}
function settle(b) {
  const cr = [], db = [];
  for (const [id, v] of Object.entries(b)) { if (v > 0.5) cr.push([id, v]); else if (v < -0.5) db.push([id, -v]); }
  cr.sort((x, y) => y[1] - x[1]); db.sort((x, y) => y[1] - x[1]);
  const out = []; let i = 0, j = 0;
  while (i < db.length && j < cr.length) { const m = Math.min(db[i][1], cr[j][1]); out.push({from: db[i][0], to: cr[j][0], amt: m}); db[i][1] -= m; cr[j][1] -= m; if (db[i][1] < 0.5) i++; if (cr[j][1] < 0.5) j++; }
  return out;
}

function viewPlan() {
  const dates = tripDates();
  if (!dates.includes(S.planDay)) S.planDay = dates[0];
  const head = `
  <div class="sec-h no-print"><div><h2>Schedule</h2><div class="sub">Tap any plan to edit it. Everything saves on its own.</div></div><span class="sp"></span>
    <div class="seg"><button class="${S.planMode === 'day' ? 'on' : ''}" data-act="plan-mode" data-v="day">Day view</button><button class="${S.planMode === 'full' ? 'on' : ''}" data-act="plan-mode" data-v="full">Full trip</button></div>
    <button class="btn" data-act="print">Print</button>
    <button class="btn pri" data-act="new-ev">+ Add plan</button>
  </div>`;
  if (S.planMode === 'full') {
    return head + `<div class="full">${dates.map(d => {
      const evs = S.events.filter(e => e.date === d).sort(evSort); const p = dParts(d);
      const cost = evs.reduce((s, e) => s + num(e.cost), 0);
      return `<div class="col"><div class="col-h"><div class="row"><span class="num">${p.w} ${p.n}</span><span class="sp"></span>${cost ? `<span class="chip">${inr(cost)}</span>` : ''}</div><div class="sub" style="font-weight:600">${esc(S.days[d] || '')}</div></div>
        ${evs.length ? evs.map(e => { const c = CATS[e.cat] || CATS.chill; return `<div class="it" data-act="edit-ev" data-id="${e.id}"><span class="tm">${e.time ? fmtTime(e.time).replace(' ', '') : 'Any'}</span><span class="cdot" style="background:${c.c};transform:translateY(-1px)"></span><span>${esc(e.title)}${e.status === 'idea' ? ' <span class="chip st-idea">idea</span>' : ''}</span></div>`; }).join('') : '<div class="it sub">Free day</div>'}
      </div>`;
    }).join('')}</div>`;
  }
  const d = S.planDay, p = dParts(d);
  const evs = S.events.filter(e => e.date === d).sort(evSort);
  const cost = evs.reduce((s, e) => s + num(e.cost), 0);
  return head + `
  <div class="days no-print">${dates.map(x => { const q = dParts(x); const c = S.events.filter(e => e.date === x).length; return `<button class="day-pill ${x === d ? 'on' : ''}" data-act="day" data-v="${x}"><div class="dw">${q.w}</div><div class="dn">${q.n}</div><div class="dc">${c} plan${c === 1 ? '' : 's'}</div></button>`; }).join('')}</div>
  <div class="day-head">
    <div class="day-big">${p.n}</div>
    <div style="flex:1;min-width:220px">
      <div class="sub" style="font-weight:700;text-transform:uppercase;letter-spacing:.08em">${p.long}</div>
      <textarea class="day-title" rows="1" placeholder="Name this day..." data-act="day-title" data-v="${d}">${esc(S.days[d] || '')}</textarea>
    </div>
    <div class="row"><span class="chip">${evs.length} plans</span><span class="chip">${inr(cost)} / head</span><button class="btn sm" data-act="new-ev" data-v="${d}">+ Add</button></div>
  </div>
  ${evs.length ? `<div class="tl">${evs.map(evCard).join('')}</div>` : `<div class="empty"><div class="e">🏝️</div><b>Nothing planned yet</b><div class="sub">Add a plan or grab one from Guide › Explore.</div><button class="btn pri mt" data-act="new-ev" data-v="${d}">+ Add plan</button></div>`}`;

function evCard(e) {

    <div class="ev-card" data-act="edit-ev" data-id="${e.id}">

function viewMoney() {
  const seg = `<div class="seg"><button class="${S.moneyTab === 'budget' ? 'on' : ''}" data-act="money-tab" data-v="budget">Budget</button><button class="${S.moneyTab === 'split' ? 'on' : ''}" data-act="money-tab" data-v="split">Split bills</button></div>`;
  if (S.moneyTab === 'split') return viewSplit(seg);
  const bt = budgetTotals(), sp = spentPP(), n = S.crew.length;
  const pct = Math.min(100, bt.planned / bt.cap * 100 || 0);
  return `<div class="sec-h"><div><h2>Budget</h2><div class="sub">Per person. Edit any number, totals update live.</div></div><span class="sp"></span>${seg}</div>
  <div class="grid g4">
    <div class="card stat"><div class="k">Planned</div><div class="v">${inr(bt.planned)}</div><div class="meter ${bt.planned > bt.cap ? 'bad' : pct > 92 ? 'warn' : 'ok'}"><i style="width:${pct}%"></i></div></div>
    <div class="card stat"><div class="k">Headroom</div><div class="v ${bt.head < 0 ? 'neg' : 'pos'}">${inr(bt.head)}</div><div class="s">vs ${inr(bt.cap)} cap</div></div>
    <div class="card stat"><div class="k">Paid so far</div><div class="v">${inr(bt.paid)}</div><div class="s">${inr(bt.planned - bt.paid)} left to spend/pay</div></div>
    <div class="card stat"><div class="k">Group total</div><div class="v">${inr(bt.planned * n)}</div><div class="s">${n} people × planned</div></div>
  </div>
  <div class="card mt"><div class="scroll-x"><table class="tbl btbl">
    <thead><tr><th class="ic-col"></th><th>Item</th><th class="n">Planned</th><th class="n">Paid</th><th class="n">Spent (Split)</th><th>Used</th><th></th></tr></thead>
    <tbody>${S.budget.map(b => { const s = sp.m[b.id] || 0; const used = num(b.paid) + s; const pc = num(b.planned) ? Math.min(100, used / num(b.planned) * 100) : 0; return `<tr>
      <td class="ic-col"><input value="${esc(b.icon)}" data-bind="budget.${b.id}.icon" style="text-align:center;padding:7px 4px"></td>
      <td><input value="${esc(b.name)}" data-bind="budget.${b.id}.name" style="min-width:150px"></td>
      <td data-l="Planned"><input class="n" type="number" inputmode="numeric" value="${num(b.planned)}" data-bind="budget.${b.id}.planned"></td>
      <td data-l="Paid"><input class="n" type="number" inputmode="numeric" value="${num(b.paid)}" data-bind="budget.${b.id}.paid"></td>
      <td class="n">${s ? inr(s) + '<span class="sub"> spent</span>' : '<span class="sub">-</span>'}</td>
      <td><div class="mini-bar ${used > num(b.planned) ? 'over' : ''}"><i style="width:${pc}%"></i></div></td>
      <td><button class="icon-btn" data-act="del" data-coll="budget" data-id="${b.id}" title="Remove">✕</button></td></tr>`; }).join('')}</tbody>
    <tfoot><tr><td class="ic-col"></td><td>Total</td><td class="n">${inr(bt.planned)}</td><td class="n">${inr(bt.paid)}</td><td class="n">${inr(sp.t)}</td><td colspan="2"></td></tr></tfoot>
  </table></div>
  <button class="btn sm mt" data-act="add-budget">+ Add line</button></div>
  <div class="sub mt">Tip: when you log a shared bill in Split, pick its budget line. "Spent" fills in automatically, so you see where the money actually went.</div>`;
}

          <div style="flex:1"><label class="f">Paid by</label><select id="x-payer">${S.crew.map(p => `<option value="${p.id}" ${p.id === S.me ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div></div>
        <div><label class="f">Budget line</label><select id="x-cat">${S.budget.map(b => `<option value="${b.id}" ${/food/i.test(b.name) ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}</select></div>

      <div class="row"><button class="btn" data-act="export">Export backup</button><label class="btn" style="cursor:pointer">Import<input type="file" accept=".json,application/json" id="imp" hidden></label><span class="sp"></span><button class="btn danger" data-act="reset">Reset</button></div>
    </div>
  </div>`;
}

/* ===== render ===== */
function render() {
  renderNav();
  const v = {home: viewHome, plan: viewPlan, money: viewMoney, lists: viewLists, guide: viewGuide, setup: viewSetup}[S.tab] || viewHome;
  $('#app').innerHTML = v();
  tick();
}
function tick() {
  const el = $('#cd'); if (!el) return;
  const ms = new Date(S.trip.depart) - new Date();
  if (!(ms > 0)) { el.innerHTML = `<div style="min-width:auto;padding:12px 18px"><b style="font-size:30px;font-family:var(--display);font-weight:400">${new Date() < new Date(S.trip.end + 'T23:59') ? "Goa mode: on." : 'Legendary trip. Same time next year?'}</b></div>`; return; }
  const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60, s = Math.floor(ms / 1e3) % 60;
  el.innerHTML = [[d, 'days'], [h, 'hrs'], [m, 'min'], [s, 'sec']].map(([v, l]) => `<div><b>${String(v).padStart(2, '0')}</b><span>${l}</span></div>`).join('');
}
setInterval(tick, 1000);

/* ===== event modal ===== */
function openEv(ev) {
  const isNew = !S.events.some(e => e.id === ev.id);
  const dates = tripDates();
  $('#modal').innerHTML = `
    <div class="row mb"><h2 style="font-size:22px">${isNew ? 'New plan' : 'Edit plan'}</h2><span class="sp"></span><button class="icon-btn" data-act="close">✕</button></div>
    <div class="grid" style="gap:12px">
      <div><label class="f">What</label><input id="m-title" value="${esc(ev.title)}" placeholder="Sunset at Chapora Fort"></div>
      <div><label class="f">Type</label><div class="cats" id="m-cat">${Object.entries(CATS).map(([k, c]) => `<button type="button" data-v="${k}" class="${ev.cat === k ? 'on' : ''}" ><span class="cdot" style="background:${c.c}"></span>${c.l}</button>`).join('')}</div></div>
      <div class="row" style="flex-wrap:nowrap">
        <div style="flex:1.4"><label class="f">Day</label><select id="m-date">${dates.map(d => { const p = dParts(d); return `<option value="${d}" ${d === ev.date ? 'selected' : ''}>${p.w} ${p.n} ${p.m}</option>`; }).join('')}</select></div>
        <div style="flex:1"><label class="f">Start</label><input type="time" id="m-time" value="${esc(ev.time)}"></div>
        <div style="flex:1"><label class="f">End</label><input type="time" id="m-end" value="${esc(ev.end)}"></div>
      </div>
      <div><label class="f">Place (opens in Maps)</label><input id="m-place" value="${esc(ev.place)}" placeholder="Chapora Fort"></div>
      <div class="row" style="flex-wrap:nowrap">
        <div style="flex:1"><label class="f">Cost / head ₹</label><input type="number" inputmode="numeric" id="m-cost" value="${num(ev.cost) || ''}" placeholder="0"></div>
        <div style="flex:1"><label class="f">Status</label><select id="m-status">${Object.entries(STATUS).map(([k, l]) => `<option value="${k}" ${ev.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      </div>
      <div><label class="f">Notes</label><textarea id="m-notes" placeholder="Book ahead, carry cash, etc.">${esc(ev.notes)}</textarea></div>
      <div class="row">${isNew ? '' : `<button class="btn danger" data-act="del-ev" data-id="${ev.id}">Delete</button><button class="btn" data-act="dup-ev" data-id="${ev.id}">Duplicate</button>`}<span class="sp"></span><button class="btn ghost" data-act="close">Cancel</button><button class="btn pri" data-act="save-ev" data-id="${ev.id}">Save</button></div>
    </div>`;
  $('#ov').classList.add('open');
  setTimeout(() => { if (isNew && !ev.title) $('#m-title').focus(); }, 50);
}
function closeModal() { $('#ov').classList.remove('open'); }
function newEv(o = {}) { return Object.assign({id: uid(), date: S.planDay || tripDates()[0], time: '', end: '', title: '', cat: 'explore', place: '', cost: 0, status: 'planned', notes: ''}, o); }

/* ===== actions ===== */
document.addEventListener('click', e => {
  if (e.target.closest('[data-stop]')) { e.stopPropagation(); return; }
  if (e.target === $('#ov')) return closeModal();
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, v = t.dataset.v, id = t.dataset.id;
  if (t.tagName === 'SELECT' || (t.tagName === 'INPUT' && t.type !== 'button')) return;
  switch (a) {
    case 'tab': S.tab = v; save(); render(); scrollTo(0, 0); break;
    case 'go-list': S.tab = 'lists'; S.listTab = v; save(); render(); scrollTo(0, 0); break;
    case 'day': S.planDay = v; save(); render(); break;
    case 'plan-mode': S.planMode = v; save(); render(); break;
    case 'money-tab': S.moneyTab = v; save(); render(); break;
    case 'list-tab': S.listTab = v; save(); render(); break;
    case 'guide-tab': S.guideTab = v; save(); render(); break;
    case 'guide-filter': S.guideFilter = v; save(); render(); break;
    case 'print': S.planMode = 'full'; save(); render(); setTimeout(() => print(), 150); break;
    case 'new-ev': openEv(newEv(v ? {date: v} : {})); break;
    case 'edit-ev': { const ev = S.events.find(x => x.id === id); if (ev) openEv({...ev}); break; }
    case 'idea-add': { const x = IDEAS[+v]; openEv(newEv({title: x.t, place: x.p, cat: x.cat, cost: x.c, notes: x.n, status: 'idea'})); break; }
    case 'close': closeModal(); break;
    case 'save-ev': {
      const title = $('#m-title').value.trim(); if (!title) { $('#m-title').focus(); toast('Give it a name'); return; }
      const on = $('#m-cat button.on');
      const ev = {id, title, cat: on ? on.dataset.v : 'explore', date: $('#m-date').value, time: $('#m-time').value, end: $('#m-end').value, place: $('#m-place').value.trim(), cost: num($('#m-cost').value), status: $('#m-status').value, notes: $('#m-notes').value.trim()};
      const i = S.events.findIndex(x => x.id === id); if (i >= 0) S.events[i] = ev; else S.events.push(ev);
      S.planDay = ev.date; save(); closeModal(); render(); toast('Saved ✓'); break;
    }
    case 'del-ev': if (confirm('Delete this plan?')) { S.events = S.events.filter(x => x.id !== id); save(); closeModal(); render(); toast('Deleted'); } break;
    case 'dup-ev': { const ev = S.events.find(x => x.id === id); if (ev) { closeModal(); openEv({...ev, id: uid(), title: ev.title + ' (copy)'}); } break; }
    case 'del': { const c = t.dataset.coll; S[c] = S[c].filter(x => x.id !== id); save(); render(); break; }
    case 'add-budget': S.budget.push({id: uid(), icon: '💸', name: 'New item', planned: 0, paid: 0}); save(); render(); break;
    case 'add-exp': {
      const title = $('#x-title').value.trim(), amount = num($('#x-amt').value);
      const split = [...document.querySelectorAll('#x-split button.on')].map(b => b.dataset.pid);
      if (!title || amount <= 0) { toast('Add a name and amount'); return; }
      if (!split.length) { toast('Pick who it\'s split between'); return; }
      S.expenses.push({id: uid(), title, amount, payer: $('#x-payer').value, cat: $('#x-cat').value, split, date: iso(new Date())});
      save(); render(); toast('Bill added ✓'); break;
    }
    case 'add-gear': { const i = $('#gear-new'); if (i.value.trim()) { S.gear.push({id: uid(), text: i.value.trim(), who: '', done: false}); save(); render(); } break; }
    case 'add-pack': { const i = t.parentElement.querySelector('input'); if (i.value.trim()) { S.packing.push({id: uid(), group: i.dataset.group, text: i.value.trim(), done: {}}); save(); render(); } break; }
    case 'add-group': { const i = $('#pack-group'); const g = i.value.trim(); if (g) { S.packing.push({id: uid(), group: g, text: 'First item', done: {}}); save(); render(); } break; }
    case 'add-booking': S.bookings.push({id: uid(), name: 'New booking', ref: '', status: 'todo', due: 0, date: '', contact: '', notes: ''}); save(); render(); break;
    case 'add-contact': S.contacts.push({id: uid(), icon: '📞', name: 'New contact', num: '', note: ''}); save(); render(); break;
    case 'add-crew': S.crew.push({id: uid(), name: 'New person', color: COLORS[S.crew.length % COLORS.length]}); save(); render(); break;
    case 'del-crew': if (S.crew.length > 1 && confirm('Remove this person? Their bills stay but won\'t count in balances.')) { S.crew = S.crew.filter(p => p.id !== id); if (S.me === id) S.me = S.crew[0].id; save(); render(); } break;
    case 'export': {
      const blob = new Blob([JSON.stringify(S, null, 2)], {type: 'application/json'});
      const a2 = document.createElement('a'); a2.href = URL.createObjectURL(blob); a2.download = 'goa26-planner-' + iso(new Date()) + '.json'; a2.click(); setTimeout(() => URL.revokeObjectURL(a2.href), 2000); toast('Backup downloaded'); break;
    }
    case 'reset': if (confirm('Reset everything to the starter plan? Export a backup first if you need it.')) { S = defaults(); save(); render(); toast('Reset done'); } break;
  }
});
// category chips in modal + split chips
document.addEventListener('click', e => {
  const c = e.target.closest('#m-cat button');
  if (c) { document.querySelectorAll('#m-cat button').forEach(b => { b.classList.remove('on'); b.style.background = ''; }); c.classList.add('on'); }
  const s = e.target.closest('#x-split button');
  if (s) { s.classList.toggle('on');  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'imp') {
    const f = t.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if (!d || d.v !== 1 || !Array.isArray(d.events)) throw 0; S = Object.assign(defaults(), d); save(); render(); toast('Imported ✓'); } catch (err) { toast('That file doesn\'t look like a planner backup'); } };
    r.readAsText(f); return;
  }
  const a = t.dataset.act;
  if (a === 'set-me') { S.me = t.value; save(); render(); return; }
  if (a === 'pack') { const p = S.packing.find(x => x.id === t.dataset.id); if (p) { p.done[S.me] = t.checked; save(); render(); } return; }
  if (a === 'gear-done') { const g = S.gear.find(x => x.id === t.dataset.id); if (g) { g.done = t.checked; save(); render(); } return; }
  if (a === 'day-title') { S.days[t.dataset.v] = t.value; save(); return; }
  const b = t.dataset.bind; if (!b) return;
  const [coll, id, f] = b.split('.');
  const isNum = t.type === 'number';
  const val = isNum ? num(t.value) : t.value;
  if (coll === 'trip') S.trip[f] = val;
  else { const o = S[coll].find(x => x.id === id); if (o) o[f] = val; }
  save(); render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && e.target.matches('#gear-new,.pack-new,#pack-group')) { e.preventDefault(); const btn = e.target.parentElement.querySelector('button'); btn && btn.click(); }
  if (e.key === 'Enter' && e.target.classList.contains('day-title')) e.target.blur();
});

render();
</script>
</body>
</html>
